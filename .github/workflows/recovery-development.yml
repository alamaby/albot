name: recovery-development

on:
  schedule:
    # Every 5 minutes: recovery poll for queued/expired-lease jobs, dead-job
    # marking, stale-session expiry, and retention purge on the development
    # deployment. The durable jobs table is the source of truth; this poll is
    # the safety net for anything the inline dispatcher missed.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      recovery_url:
        description: "Development recovery endpoint URL (default: stable dev alias)"
        type: string
        required: false
        default: "https://albot-dev.vercel.app/api/recovery/run"

permissions:
  contents: read

jobs:
  recovery-development:
    name: Run recovery sweep (development)
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compute recovery URL
        id: url
        run: |
          if [ -n "${{ inputs.recovery_url }}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.recovery_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://albot-dev.vercel.app/api/recovery/run" >> "$GITHUB_OUTPUT"
          fi

      - name: Invoke recovery endpoint
        id: recovery
        env:
          RECOVERY_URL: ${{ steps.url.outputs.url }}
          JOB_PROCESSOR_SECRET: ${{ secrets.JOB_PROCESSOR_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -f -X POST \
            -H "Authorization: Bearer ${JOB_PROCESSOR_SECRET}" \
            -H "Content-Type: application/json" \
            -H "X-Correlation-Id: gh-${GITHUB_RUN_ID}" \
            -d '{"source":"github-actions-cron"}' \
            -w "\n%{http_code}" \
            "${RECOVERY_URL}")"
          HTTP_CODE="$(printf '%s' "${RESPONSE}" | tail -n1)"
          BODY="$(printf '%s' "${RESPONSE}" | sed '$d')"
          echo "http_code=${HTTP_CODE}"
          echo "body=${BODY}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::recovery endpoint returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "result=${BODY}" >> "$GITHUB_OUTPUT"

      - name: Summarize recovery run
        if: always()
        run: |
          {
            echo "## Recovery sweep (development)"
            echo ""
            echo "HTTP \`${{ steps.recovery.outputs.http_code }}\`"
            echo ""
            echo "\`\`\`json"
            echo "${{ steps.recovery.outputs.result }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
