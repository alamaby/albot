name: deploy-development

# Auto-deploy main to Vercel (Preview target, which holds the dev env vars)
# and re-point the stable alias albot-dev.vercel.app to the new deployment.
# Runs after migrate-development so the DB schema is applied first; the bot
# code is backward/forward compatible with additive migrations.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-development:
    name: Deploy Vercel preview + alias albot-dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI (pinned)
        run: npm install --no-save vercel@47.0.2

      - name: Wait for migrate-development (schema first)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "waiting for migrate-development on $SHA"
          # Use gh CLI to block until the run finishes. This avoids GitHub's
          # REST API lag (observed: 5+ minutes for status flips) that defeats
          # raw curl polling. Fall back to deploy if no run exists yet
          # (migration will apply on the next push; recent migrations are
          # additive so the new code stays backward-compatible).
          RUN_ID="$(gh run list --workflow=migrate-development.yml --limit 20 \
            --json databaseId,headSha \
            --jq '.[] | select(.headSha=="'"$SHA"'") | .databaseId' | head -1)"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::no migrate-development run for $SHA yet; deploying without wait"
            exit 0
          fi
          echo "watching migrate-development run=$RUN_ID"
          if ! gh run watch "$RUN_ID" --exit-status; then
            echo "::warning::gh run watch failed; falling back to polling"
            for i in $(seq 1 60); do
              STATUS="$(gh run view "$RUN_ID" --json status -q .status 2>/dev/null || echo missing)"
              if [ "$STATUS" = "completed" ]; then break; fi
              sleep 5
            done
            CONCLUSION="$(gh run view "$RUN_ID" --json conclusion -q .conclusion 2>/dev/null || echo unknown)"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::migrate-development final state=$CONCLUSION; skipping deploy"
              exit 1
            fi
          fi
          echo "schema migration ok"

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Org/project IDs are non-secret identifiers (they also live in the
          # local .vercel/repo.json). Hardcoding them avoids a mismatch with
          # the environment secrets, which caused "Could not retrieve Project
          # Settings" on vercel pull.
          VERCEL_ORG_ID: team_7caBsxNQrtdtkzQGbPBAFYKe
          VERCEL_PROJECT_ID: prj_joLciwdA37o6er3DKRSkiWlOhgJs
        run: |
          # Fresh runners have no .vercel/project.json (gitignored), and
          # `vercel link` in CLI 47 only accepts --project <NAME>, not
          # --project-id. Write the link file directly from the org/project
          # IDs so linking is version-independent.
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          # Diagnostic: print only the HTTP status (never the token).
          # 401 = token invalid/expired, 403 = token lacks team scope,
          # 404 = wrong org/project pair, 200 = token fine (look elsewhere).
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          echo "vercel api projects probe: HTTP $CODE"
          # --scope pins the team: the CLI resolves the project against the
          # token's default team unless told otherwise, and the token's
          # default team is not the one owning this project.
          npx vercel pull --yes --scope "$VERCEL_ORG_ID" \
            --environment=preview --token "$VERCEL_TOKEN"

      - name: Build (preview target)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_7caBsxNQrtdtkzQGbPBAFYKe
        run: npx vercel build --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_7caBsxNQrtdtkzQGbPBAFYKe
        run: |
          URL="$(npx vercel deploy --prebuilt --yes --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed: $URL"

      - name: Alias albot-dev.vercel.app to the new deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_7caBsxNQrtdtkzQGbPBAFYKe
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx vercel alias set "$DEPLOY_URL" albot-dev.vercel.app \
          --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Health check
        run: |
          sleep 10
          STATUS="$(curl -s https://albot-dev.vercel.app/api/health || true)"
          echo "health: $STATUS"
          if ! echo "$STATUS" | grep -q '"status":"ok"'; then
            echo "::warning::health not ok yet (may need warm-up): $STATUS"
          fi
