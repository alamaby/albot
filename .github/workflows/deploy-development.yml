name: deploy-development

# Auto-deploy main to Vercel (Preview target, which holds the dev env vars)
# and re-point the stable alias albot-dev.vercel.app to the new deployment.
# Runs after migrate-development so the DB schema is applied first; the bot
# code is backward/forward compatible with additive migrations.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-development:
    name: Deploy Vercel preview + alias albot-dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI (pinned)
        run: npm install --no-save vercel@47.0.2

      - name: Wait for migrate-development (schema first)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "waiting for migrate-development on $SHA"
          # Loop polls the GitHub API for the migrate-development run for this
          # exact commit. The run is auto-triggered by the same push; the loop
          # tolerates initial in_progress state until it sees a terminal
          # conclusion.
          for i in $(seq 1 30); do
            RESP="$(curl -s -f -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/migrate-development.yml/runs?head_sha=$SHA&event=push&status=completed")" || {
              echo "::warning::cannot query workflow runs (attempt $i)"; sleep 10; continue;
            }
            if [ "$(echo "$RESP" | jq -r '.total_count // 0')" -gt 0 ]; then
              CONCLUSION="$(echo "$RESP" | jq -r '.workflow_runs[0].conclusion')"
              echo "migrate-development conclusion=$CONCLUSION (attempt $i)"
              if [ "$CONCLUSION" = "success" ]; then
                echo "schema migration ok"; break
              elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ]; then
                echo "::error::migrate-development failed ($CONCLUSION); skipping deploy"; exit 1
              fi
            else
              echo "no completed migrate-development run yet for $SHA (attempt $i)"
            fi
            sleep 10
          done
          # Final guard: if the loop exited without finding a success, the most
          # recent state is whatever the API reported. Re-check once before
          # failing, since the API can lag behind the workflow completion.
          if [ "$CONCLUSION" != "success" ]; then
            echo "::warning::migrate-development not in 'success' state after polling window; re-checking once"
            sleep 15
            RESP="$(curl -s -f -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/migrate-development.yml/runs?head_sha=$SHA")" || true
            FINAL="$(echo "$RESP" | jq -r '.workflow_runs[0].conclusion // "unknown"')"
            if [ "$FINAL" != "success" ]; then
              echo "::error::migrate-development final state=$FINAL; skipping deploy"; exit 1
            fi
          fi

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build (preview target)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --yes --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(npx vercel deploy --prebuilt --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed: $URL"

      - name: Alias albot-dev.vercel.app to the new deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx vercel alias set "$DEPLOY_URL" albot-dev.vercel.app --token "$VERCEL_TOKEN"

      - name: Health check
        run: |
          sleep 10
          STATUS="$(curl -s https://albot-dev.vercel.app/api/health || true)"
          echo "health: $STATUS"
          if ! echo "$STATUS" | grep -q '"status":"ok"'; then
            echo "::warning::health not ok yet (may need warm-up): $STATUS"
          fi
